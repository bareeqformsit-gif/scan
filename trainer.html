<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14323F">
<title>حضور الدورة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1D2B32;--mute:#647680;--line:#DCE5E3;--pri:#14323F;--sea:#1F6F78;--mint:#E6F1EF;--ok:#1F6E4C;--okb:#E3F3EB;--late:#8A5E12;--lateb:#FBF0DA;--bad:#9C3029;--badb:#FAE7E5;--exc:#2F5A93;--excb:#E7EEF8}
  *{box-sizing:border-box}
  body{margin:0;background:#F4F7F6;color:var(--ink);font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;font-size:14.5px;line-height:1.6;font-feature-settings:"tnum" 1}
  header{background:var(--pri);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .m{font-size:12.5px;color:#BFD3D6}
  header button.b{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
  .sp{flex:1}
  nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
  nav button{border:0;background:none;font:inherit;font-weight:600;padding:12px 14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--sea);border-bottom-color:var(--sea)}
  main{max-width:1100px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;min-width:0}
  .card h3{margin:0 0 10px;font-size:15.5px;font-weight:700;color:var(--pri)}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .g2>.card{margin-bottom:0}
  .g2{margin-bottom:12px}
  @media(max-width:760px){.g2{grid-template-columns:1fr}}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .kpi{padding:14px 16px;border-inline-start:1px solid var(--line)}.kpi:first-child{border-inline-start:0}
  .kpi b{display:block;font-size:28px;font-weight:800;color:var(--pri);line-height:1.3}.kpi b small{font-size:16px;color:var(--mute)}.kpi span{color:var(--mute);font-size:12px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
  th{background:var(--mint);color:var(--pri);font-size:12.5px;font-weight:700}
  .chip{display:inline-block;padding:1px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .c-ok{background:var(--okb);color:var(--ok)}.c-late{background:var(--lateb);color:var(--late)}.c-bad{background:var(--badb);color:var(--bad)}.c-exc{background:var(--excb);color:var(--exc)}.c-mute{background:#eef0f4;color:var(--mute)}
  .bar{height:8px;background:#E6ECEB;border-radius:6px;overflow:hidden;min-width:70px;flex:1}.bar i{display:block;height:100%;background:#2E9E6E}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,button.b{font:inherit;border:1px solid #C8D5D2;border-radius:10px;padding:7px 12px;background:#fff;color:var(--ink)}
  button.b{cursor:pointer;font-weight:700}button.p{background:var(--sea);color:#fff;border-color:var(--sea)}
  .muted{color:var(--mute);font-size:12px}
  .tab{display:none}.tab.on{display:block}
  .empty{padding:24px;text-align:center;color:var(--mute)}
  .low{color:var(--bad);font-weight:bold}
  .c-warn{background:var(--lateb);color:var(--late)}.c-info{background:var(--excb);color:var(--exc)}
  .notebox{background:#F6FAF9;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
  .notebox .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .att-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:8px 0 12px}
  .att-sum span{display:inline-flex;align-items:center;gap:6px}.att-sum i{width:10px;height:10px;border-radius:3px}.att-sum b{color:var(--pri)}
  .tw{overflow-x:auto}
  .tw td,.tw th{white-space:nowrap}
  tr.st{cursor:pointer}tr.st:hover td{background:#F1F6F5}
  .wide-only{}
  @media(max-width:640px){.wide-only{display:none}}
  .modal{position:fixed;inset:0;background:rgba(20,50,63,.42);display:none;align-items:center;justify-content:center;z-index:45;padding:12px}
  .modal.on{display:flex}
  .modal .card{width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 18px 50px rgba(20,50,63,.25);margin:0}
  h4{margin:16px 0 8px;font-size:14px;color:var(--pri)}
  /* ---------- طباعة / PDF ---------- */
  #print{display:none}
  body.printing header,body.printing nav,body.printing main{display:none}
  body.printing #print{display:block}
  #print{max-width:900px;margin:0 auto;padding:24px;background:#fff}
  #print h1{font-size:22px;margin:0 0 4px;font-weight:800;color:var(--pri)}
  #print h3{font-size:15px;margin:18px 0 8px;color:var(--pri)}
  #print .meta{color:var(--mute);margin-bottom:14px;line-height:1.7}
  #print table{font-size:12px;margin-bottom:16px}
  #print th,#print td{border:1px solid #D3DEDB;padding:5px 8px}
  #print .tools{margin-bottom:16px}
  .pk{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .pk div{padding:10px 14px;border-inline-start:1px solid var(--line)}.pk div:first-child{border-inline-start:0}
  .pk b{display:block;font-size:22px;font-weight:800;color:var(--pri)}.pk span{font-size:11.5px;color:var(--mute)}
  .pgrid{display:grid;grid-template-columns:300px 1fr;gap:14px}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;break-inside:avoid}
  .pcard h3{margin:0 0 8px!important}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #print{padding:0;max-width:none}
    #print .tools{display:none}
    tr{page-break-inside:avoid}
    .chip{border:1px solid #ccc}
    #print .ch-line svg,#print .ch-cols svg{width:100%!important;height:auto!important}
    #print .ch-cols.scroll{overflow:visible}
  }
/*@CH-CSS*/
  /* ---------- المخططات (CH) ---------- */
  .ch{position:relative}
  .ch svg{display:block;overflow:visible;max-width:none;direction:ltr}
  .ch svg text{font-family:inherit;fill:#647680;font-size:11px}
  .ch .ch-tick{font-variant-numeric:tabular-nums}
  .ch .ch-sub{font-size:10.5px;fill:#8696A0}
  .ch .ch-axt{font-size:11px;fill:#8696A0}
  .ch .ch-thl{fill:#9C3029;font-size:11px;font-weight:700}
  .ch .ch-cap{fill:#14323F;font-size:11.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch .ch-end{fill:#14323F;font-size:12.5px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch-cols.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .ch-col{transition:opacity .18s}
  .ch svg.dim .ch-col:not(.hl){opacity:.35}
  .ch-hit{cursor:pointer;outline:none}
  .ch-hit:focus-visible{outline:none;stroke:#1F6F78;stroke-width:1.5;stroke-dasharray:3 3}
  .ch-cross{display:none;pointer-events:none}
  .ch svg.xon .ch-cross{display:block}
  .ch-arc{transition:stroke-width .18s,opacity .18s;cursor:pointer;outline:none}
  .ch svg.dim .ch-arc:not(.hl){opacity:.32}
  .ch-donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .ch-donut.solo{justify-content:center}
  .ch-dfig{position:relative;flex:none}
  .ch-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18%}
  .ch-dc b{font-weight:800;color:#14323F;line-height:1.1}
  .ch-dc span{font-size:11.5px;color:#647680;font-weight:600;line-height:1.35;margin-top:2px}
  .ch-legend{display:flex;flex-direction:column;gap:2px;flex:1;min-width:170px;max-width:300px}
  .ch-li{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 8px;border-radius:9px;transition:background .15s}
  .ch-li.hl,.ch-li:hover{background:#F1F6F5}
  .ch-li i{width:10px;height:10px;border-radius:3px;flex:none}
  .ch-li span{flex:1;color:#1D2B32}
  .ch-li b{font-weight:700;color:#14323F;font-variant-numeric:tabular-nums}
  .ch-li em{font-style:normal;color:#647680;font-size:12px;min-width:36px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-li.zero{opacity:.45}
  .ch-tip{position:fixed;z-index:200;background:#fff;border:1px solid #DCE5E3;border-radius:11px;box-shadow:0 12px 32px rgba(20,50,63,.16);
          padding:9px 12px;font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
          min-width:130px;max-width:330px;direction:rtl;text-align:right;font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;line-height:1.55;color:#1D2B32}
  .ch-tip.on{opacity:1;transform:none}
  .ch-tip-t{font-weight:700;color:#14323F;margin-bottom:3px}
  .ch-tip-r{display:flex;align-items:center;gap:8px}
  .ch-tip-r b{font-weight:800;color:#14323F;font-variant-numeric:tabular-nums}
  .ch-tip-r span{color:#647680}
  .ch-key{width:12px;height:3px;border-radius:2px;flex:none}
  .ch-tip-f{margin-top:5px;padding-top:5px;border-top:1px solid #EDF2F1;color:#647680}
  .ch-hbars{display:flex;flex-direction:column;gap:4px}
  .ch-hrow{display:grid;grid-template-columns:minmax(96px,36%) 1fr 46px;align-items:center;gap:12px;padding:5px 8px;border-radius:9px;outline:none;transition:background .15s}
  .ch-hrow.hl,.ch-hrow:focus-visible{background:#F1F6F5}
  .ch-hrow.click{cursor:pointer}
  .ch-hl{min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .ch-hl span{font-size:13px;font-weight:600;color:#1D2B32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-hl small{font-size:11px;color:#647680}
  .ch-htrack{position:relative;height:12px;background:#EDF2F1;border-radius:2px}
  .ch-htrack i{display:block;height:100%;border-radius:0;border-start-end-radius:4px;border-end-end-radius:4px}
  .ch-hth{position:absolute;top:-4px;bottom:-4px;width:0;border-inline-start:2px dashed #9C3029;margin-inline-start:-1px}
  .ch-hv{font-weight:800;color:#14323F;font-size:13px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-empty{padding:22px;text-align:center;color:#647680;font-size:13px}
  .ch-seg{display:flex;gap:2px;border-radius:99px;overflow:hidden;background:#EDF2F1;transition:clip-path .8s cubic-bezier(.22,.8,.26,1);clip-path:inset(0 0 0 0)}
  .ch-seg.grow{clip-path:inset(0 0 0 100%)}
  .ch-seg i{display:block;min-width:3px;outline:none;transition:filter .15s}
  .ch-seg i.rest{background:#EDF2F1;min-width:0}
  .ch-seg i.hl{filter:brightness(1.12) saturate(1.1)}
  .ch-strip{display:flex;flex-wrap:wrap;gap:3px}
  .ch-strip i{width:13px;height:13px;border-radius:3px;outline:none;transition:transform .15s,opacity .3s}
  .ch-strip i.none{background:#E4EAE9}
  .ch-strip i.hl{transform:scale(1.25)}
  .ch-strip.small{gap:2px;flex-wrap:nowrap}
  .ch-strip.small i{width:8px;height:14px;border-radius:2px}
  .ch-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#647680;margin-top:10px}
  .ch-leg span{display:inline-flex;align-items:center;gap:6px}
  .ch-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .ch-leg i.ln{width:14px;height:3px;border-radius:2px}
  .ch-leg i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed #9C3029}
  .ch-leg em{font-style:normal}
  .ch-spark{display:inline-block;vertical-align:middle}
  .ch-tbl{display:none;width:100%;border-collapse:collapse;font-size:13px}
  .ch-tbl th,.ch-tbl td{padding:6px 10px;border-bottom:1px solid #DCE5E3;text-align:right}
  .ch-tbl th{background:#E6F1EF;color:#14323F;font-weight:700;font-size:12px;position:static}
  .tbl-on .ch-plot,.tbl-on .ch-leg{display:none}
  .tbl-on .ch-tbl{display:table}
  .chd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .chd>div{flex:1;min-width:0}
  .chd h3{margin:0!important}
  .chd .muted{margin-top:1px}
  .tg{border:1px solid #DCE5E3;background:#fff;color:#647680;border-radius:8px;padding:2px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .tg:hover{border-color:#1F6F78;color:#14323F}
  @media print{.ch *{transition:none!important}.ch-tip{display:none!important}.tg{display:none}}
  @media (prefers-reduced-motion:reduce){.ch *{transition:none!important}}
  /*@CH-CSS-END*/
</style>
</head>
<body>
<header><div><h1 id="title">حضور الدورة</h1><div class="m" id="sub"></div></div><span class="sp"></span>
  <span class="m" id="upd"></span><button class="b" onclick="printMode()">طباعة / PDF</button></header>
<nav><button data-t="day" class="on">الحضور اليومي</button><button data-t="students">الطلاب والنسب</button><button data-t="sessions">الجلسات</button></nav>
<main>
  <section class="tab on" id="t-day">
    <div class="row" style="margin-bottom:12px"><input type="date" id="date"><button class="b p" onclick="load()">عرض</button><span class="muted">يتحدث تلقائيًا كل 30 ثانية</span></div>
    <div id="dayBody"><div class="empty">جارٍ التحميل…</div></div>
  </section>
  <section class="tab" id="t-students">
    <div class="kpis" id="kpis"></div>
    <div class="g2">
      <div class="card"><div class="chd"><div><h3>توزيع الحضور</h3><div class="muted">كل الجلسات منذ بداية الدورة</div></div><button class="tg" onclick="CH.toggle(this)">جدول</button></div><div id="trDonut"></div></div>
      <div class="card"><div class="chd"><div><h3>توزيع الطلاب حسب نسبة الحضور</h3><div class="muted">كم طالبًا في كل شريحة</div></div><button class="tg" onclick="CH.toggle(this)">جدول</button></div><div id="trDist"></div></div>
    </div>
    <div class="card tw" style="padding:0" id="stTable"></div>
  </section>
  <section class="tab" id="t-sessions">
    <div class="card"><div class="chd"><div><h3>نسبة الحضور في كل جلسة</h3><div class="muted">الجلسات المنتهية</div></div><button class="tg" onclick="CH.toggle(this)">جدول</button></div><div id="trLine"></div></div>
    <div class="card"><div class="chd"><div><h3>عدد الطلاب في كل جلسة</h3><div class="muted">اضغط على أي عمود للتفاصيل</div></div><button class="tg" onclick="CH.toggle(this)">جدول</button></div><div id="trCols"></div></div>
    <div class="card"><div class="chd"><div><h3>متى يصل الطلاب؟</h3><div class="muted">وقت المسح بالنسبة لبداية الجلسة</div></div><button class="tg" onclick="CH.toggle(this)">جدول</button></div><div id="trArr"></div></div>
    <div class="card tw" style="padding:0" id="sesTable"></div>
  </section>
</main>
<div id="print"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<script>/*@CH-JS*/
/* ===================== CH — مخططات SVG خفيفة دون أي مكتبة خارجية =====================
 * نفس الشيفرة داخل لوحة التحكم وصفحة المدرب وبطاقة الطالب.
 * الزمن يسير من اليمين (الأقدم) إلى اليسار (الأحدث)، مثل أعمدة أوراق الدورات.
 * كل مخطط: حركة دخول ناعمة (تُلغى إذا طلب الجهاز تقليل الحركة)، تلميح عند المرور أو اللمس
 * أو التنقل بلوحة المفاتيح، وجدول بديل بنفس الأرقام (زر "جدول").
 */
var CH = (function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var C = {
    present: '#2E9E6E', late: '#D99A2B', excused: '#4C7FC4', absent: '#CF5148',
    waiting: '#A3B4B8', upcoming: '#E1E8E6', none: '#E4EAE9',
    sea: '#1F6F78', ink: '#14323F', text: '#1D2B32', mute: '#647680',
    grid: '#E9EFEE', axis: '#C8D5D2', track: '#EDF2F1', th: '#9C3029', surface: '#FFFFFF'
  };
  var STATUS = [
    { key: 'present', name: 'حاضر', color: C.present },
    { key: 'late', name: 'متأخر', color: C.late },
    { key: 'excused', name: 'عذر', color: C.excused },
    { key: 'absent', name: 'غائب', color: C.absent }
  ];
  var CODE = { P: 0, L: 1, E: 2, A: 3 };

  // ------------------------------------------------------------------ أدوات
  function S(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function H(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  /**
   * SVG text. anchor uses left/right meaning ('start' = text begins at x and extends right).
   * Arabic text gets an RTL base so "الحد 75%" reads correctly; numbers like "-20" stay LTR.
   */
  var AR = /[\u0600-\u06FF]/;
  function T(parent, x, y, text, cls, anchor) {
    var rtl = AR.test(text), a = anchor || 'middle';
    if (rtl && a != 'middle') a = a == 'start' ? 'end' : 'start';
    var t = S('text', { x: x, y: y, 'class': cls || '', 'text-anchor': a, direction: rtl ? 'rtl' : 'ltr' }, parent);
    t.textContent = text;
    return t;
  }
  /** عدد + معدود بقواعد العربية: 1 جلسة، جلستان، 3 جلسات، 11 جلسة */
  var WORDS = {
    session: ['جلسة', 'جلستان', 'جلسات', 'جلسة'], student: ['طالب', 'طالبان', 'طلاب', 'طالبًا'],
    point: ['نقطة', 'نقطتان', 'نقاط', 'نقطة'], day: ['يوم', 'يومان', 'أيام', 'يومًا'], minute: ['دقيقة', 'دقيقتان', 'دقائق', 'دقيقة']
  };
  function count(n, w) {
    var f = WORDS[w] || w;
    n = Math.round(n);
    return n == 2 ? f[1] : n + ' ' + (n >= 3 && n <= 10 ? f[2] : n > 10 ? f[3] : f[0]);
  }
  function fmtN(n) { return n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  /** Integer percentages that always add up to 100 (largest remainder). */
  function shares(values) {
    var tot = values.reduce(function (a, v) { return a + (v || 0); }, 0);
    if (!tot) return values.map(function () { return 0; });
    var raw = values.map(function (v) { return (v || 0) * 100 / tot; }), out = raw.map(Math.floor);
    var left = 100 - out.reduce(function (a, v) { return a + v; }, 0);
    raw.map(function (v, i) { return { i: i, f: v - Math.floor(v) }; }).sort(function (a, b) { return b.f - a.f; })
      .slice(0, left).forEach(function (x) { out[x.i]++; });
    return out;
  }
  function niceScale(rawMax, k) {
    rawMax = Math.max(rawMax, 1);
    var rough = rawMax / (k || 4), p = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10)), m = rough / p;
    var step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    if (step < 1) step = 1;
    var max = Math.ceil(rawMax / step) * step, ticks = [];
    for (var t = 0; t <= max + 1e-9; t += step) ticks.push(t);
    return { max: max, ticks: ticks };
  }
  function later(fn) {
    var done = false;
    function go() { if (!done) { done = true; fn(); } }
    requestAnimationFrame(function () { requestAnimationFrame(go); });

    var p = CH.v.rate(s);
    return '<tr><td>' + esc(s.day + ' ' + s.date) + '</td><td>' + (s.n == 'X' ? 'خارج الجدول' : 'ج' + esc(s.n) + ' ' + esc(s.label)) + '</td><td>' + s.present + '</td><td>' + s.late + '</td><td>' + s.excused + '</td><td>' + s.absent +
      (s.ended ? '' : ' <span class="muted">(جارية)</span>') + '</td><td>' + (p == null ? '—' : p + '%') + '</td></tr>';
  }).join('') + '</table>' : '<div class="empty">لا جلسات بعد</div>';
  if (document.body.classList.contains('printing')) buildPrint();
}
function studentDetail(x) {
  var r = D.report;
  $('modalBody').innerHTML = '<div class="chd"><div><h3>' + esc(x.name) + '</h3><div class="muted">' + esc(r.course.name) + '</div></div><button class="b" onclick="closeModal()">إغلاق</button></div>' +
    '<div class="notebox"><div class="chips">' + noteChip(x.note, true) + '</div><div>' + esc(x.note ? x.note.text : '') + '</div>' +
    '<div class="muted" style="margin-top:6px">نسبة الحضور ' + (x.pct == null ? '—' : x.pct + '%') + ' · الالتزام ' + (x.commit == null ? '—' : x.commit + '%') + ' (الحد ' + r.black + '%)</div></div>' +
    '<div id="sdDonut"></div><h4>كل الجلسات</h4><div id="sdStrip"></div><h4>تطور نسبة الحضور</h4><div id="sdTrend"></div>';
  $('modal').classList.add('on');
  CH.donut($('sdDonut'), { size: 150, items: CH.STATUS.map(function (s) { return { label: s.name, value: x[s.key], color: s.color }; }),
    centerValue: x.pct == null ? '—' : x.pct + '%', centerLabel: 'نسبة الحضور', emptyLabel: 'لا جلسات محتسبة', unit: ' جلسة' });
  CH.v.studentStrip($('sdStrip'), x, r);
  CH.v.studentTrend($('sdTrend'), x, r);
}
function buildPrint() {
  var r = D.report, c = r.course, t = r.totals;
  $('print').innerHTML = '<div class="tools row"><button class="b p" onclick="window.print()">طباعة / حفظ PDF</button><button class="b" onclick="document.body.classList.remove(\'printing\')">رجوع</button>' +
    '<span class="muted">في نافذة الطباعة اختر "حفظ بتنسيق PDF"</span></div>' +
    '<h1>تقرير الحضور — ' + esc(c.name) + '</h1><div class="meta">' + esc(D.center) + (c.trainer ? ' — المدرب: ' + esc(c.trainer) : '') + '<br>المدة: ' + esc(c.start) + (c.end ? ' إلى ' + esc(c.end) : '') +
    ' — ' + esc(c.daysText) + ' — ' + esc(c.sessions.join('، ')) + '<br>تاريخ التقرير: ' + esc(D.updated) + '</div>' +
    '<div class="pk">' + [[r.avg == null ? '—' : r.avg + '%', 'متوسط نسب الحضور'], [r.below, 'طالب تحت ' + r.threshold + '%'], [r.blackCount, 'التزام أقل من ' + r.black + '%'], [r.endedSessions + ' / ' + r.totalSessions, 'جلسات انتهت'], [r.rows.length, 'طالب']]
      .map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>' +
    '<div class="pgrid"><div class="pcard"><h3>توزيع الحضور</h3><div id="pDonut"></div></div><div class="pcard"><h3>نسبة الحضور في كل جلسة</h3><div id="pLine"></div></div></div>' +
    '<div class="pcard"><h3>عدد الطلاب في كل جلسة</h3><div id="pCols"></div></div>' +
    '<h3>الطلاب</h3><div class="muted" style="margin:-4px 0 8px">نسبة الحضور: الغياب بعذر يُحسب غيابًا. الالتزام: الغياب بلا عذر وحده ينقصه، ومن يقلّ التزامه عن ' + r.black + '% يدخل القائمة السوداء.</div>' +
    '<table><tr><th>#</th><th>الطالب</th><th>حضور</th><th>تأخير</th><th>عذر</th><th>غياب بلا عذر</th><th>آخر الجلسات</th><th>نسبة الحضور</th><th>الالتزام</th><th>ملاحظة</th></tr>' + r.rows.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); }).map(function (x, i) {
      var low = x.pct != null && x.pct < r.threshold, bad = x.commit != null && x.commit < r.black;
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(x.name) + (x.status != 'مقبول' ? ' (' + esc(x.status) + ')' : '') + '</td><td>' + x.present + '</td><td>' + x.late + '</td><td>' + x.excused + '</td><td>' + x.absent +
        '</td><td><div class="pms" data-id="' + esc(x.id) + '"></div></td><td class="' + (low ? 'low' : '') + '">' + (x.pct == null ? '—' : x.pct + '%') + '</td><td class="' + (bad ? 'low' : '') + '">' + (x.commit == null ? '—' : x.commit + '%') + '</td><td>' + (x.note ? esc(x.note.tag) : '') + '</td></tr>';
    }).join('') + '</table>' +
    '<h3>الجلسات</h3><table><tr><th>التاريخ</th><th>الجلسة</th><th>حاضر</th><th>متأخر</th><th>عذر</th><th>غائب</th><th>النسبة</th></tr>' + r.slots.map(function (s) {
      var p = CH.v.rate(s);
      return '<tr><td>' + esc(s.day + ' ' + s.date) + '</td><td>' + (s.n == 'X' ? 'خارج الجدول' : 'ج' + esc(s.n) + ' ' + esc(s.label)) + '</td><td>' + s.present + '</td><td>' + s.late + '</td><td>' + s.excused + '</td><td>' + s.absent + '</td><td>' + (p == null ? '—' : p + '%') + '</td></tr>';
    }).join('') + '</table>';
  CH.v.donut($('pDonut'), t, { size: 150, animate: false });
  CH.v.sessionRate($('pLine'), r, { animate: false, height: 190 });
  CH.v.sessionCols($('pCols'), r, { animate: false, height: 200 });
  document.querySelectorAll('#print .pms').forEach(function (el) {
    var x = r.rows.filter(function (y) { return y.id == el.dataset.id; })[0];
    CH.v.studentStrip(el, x, r, { last: 14, small: true, animate: false });
  });
}
function printMode() { document.body.classList.add('printing'); if (D) buildPrint(); }
if (P.print) document.body.classList.add('printing');
load().then(function () { timer = setInterval(function () { if (!document.body.classList.contains('printing') && !$('modal').classList.contains('on')) load(true); }, 30000); });
</script>
</body>
</html>
