<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14323F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بطاقة الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1D2B32;--mute:#647680;--line:#DCE5E3;--pri:#14323F;--sea:#1F6F78;--mint:#E6F1EF;--ok:#2E9E6E;--late:#D99A2B;--bad:#CF5148;--exc:#4C7FC4}
  *{box-sizing:border-box}
  body{margin:0;background:#F4F7F6;color:var(--ink);font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;line-height:1.6;font-feature-settings:"tnum" 1}
  .top{background:var(--pri);color:#fff;padding:18px 18px 70px;text-align:center}
  .top .c{font-size:13px;color:#BFD3D6;font-weight:600}.top .n{font-size:26px;font-weight:800;margin-top:4px}.top .k{font-size:15px;margin-top:2px;color:#D6E6E8}
  .wrap{max-width:460px;margin:-52px auto 0;padding:0 14px 30px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
  .qr{display:block;width:100%;max-width:300px;margin:0 auto;image-rendering:pixelated;background:#fff}
  .code{text-align:center;font-weight:700;font-size:20px;letter-spacing:2px;margin-top:10px;direction:ltr;color:var(--pri)}
  .tip{text-align:center;color:var(--mute);font-size:13px;margin-top:6px}
  .row{display:flex;gap:12px;align-items:center}
  #ring{flex:none}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1}
  .stats div{background:var(--mint);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute);font-weight:600}
  .stats i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px}
  .stats b{display:block;font-size:20px;font-weight:800;color:var(--pri)}
  h4{margin:16px 0 8px;font-size:14px;color:var(--pri);font-weight:700}
  h3{margin:0 0 10px;font-size:16px;font-weight:700;color:var(--pri)}
  .hist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .hist div:last-child{border:0}
  .chip{padding:1px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-ok{background:#E3F3EB;color:#1F6E4C}.c-late{background:#FBF0DA;color:#8A5E12}.c-bad{background:#FAE7E5;color:#9C3029}.c-exc{background:#E7EEF8;color:#2F5A93}
  .muted{color:var(--mute);font-size:12px}
  .warn{background:#FBF0DA;color:#8A5E12;border:1px solid #F1DDAF;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
  .err{background:#FAE7E5;color:#9C3029;border-color:#F2CCC8}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--mint);color:var(--pri);cursor:pointer}
  .center{text-align:center}
/*@CH-CSS*/
  /* ---------- المخططات (CH) ---------- */
  .ch{position:relative}
  .ch svg{display:block;overflow:visible;max-width:none;direction:ltr}
  .ch svg text{font-family:inherit;fill:#647680;font-size:11px}
  .ch .ch-tick{font-variant-numeric:tabular-nums}
  .ch .ch-sub{font-size:10.5px;fill:#8696A0}
  .ch .ch-axt{font-size:11px;fill:#8696A0}
  .ch .ch-thl{fill:#9C3029;font-size:11px;font-weight:700}
  .ch .ch-cap{fill:#14323F;font-size:11.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch .ch-end{fill:#14323F;font-size:12.5px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch-cols.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .ch-col{transition:opacity .18s}
  .ch svg.dim .ch-col:not(.hl){opacity:.35}
  .ch-hit{cursor:pointer;outline:none}
  .ch-hit:focus-visible{outline:none;stroke:#1F6F78;stroke-width:1.5;stroke-dasharray:3 3}
  .ch-cross{display:none;pointer-events:none}
  .ch svg.xon .ch-cross{display:block}
  .ch-arc{transition:stroke-width .18s,opacity .18s;cursor:pointer;outline:none}
  .ch svg.dim .ch-arc:not(.hl){opacity:.32}
  .ch-donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .ch-donut.solo{justify-content:center}
  .ch-dfig{position:relative;flex:none}
  .ch-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18%}
  .ch-dc b{font-weight:800;color:#14323F;line-height:1.1}
  .ch-dc span{font-size:11.5px;color:#647680;font-weight:600;line-height:1.35;margin-top:2px}
  .ch-legend{display:flex;flex-direction:column;gap:2px;flex:1;min-width:170px;max-width:300px}
  .ch-li{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 8px;border-radius:9px;transition:background .15s}
  .ch-li.hl,.ch-li:hover{background:#F1F6F5}
  .ch-li i{width:10px;height:10px;border-radius:3px;flex:none}
  .ch-li span{flex:1;color:#1D2B32}
  .ch-li b{font-weight:700;color:#14323F;font-variant-numeric:tabular-nums}
  .ch-li em{font-style:normal;color:#647680;font-size:12px;min-width:36px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-li.zero{opacity:.45}
  .ch-tip{position:fixed;z-index:200;background:#fff;border:1px solid #DCE5E3;border-radius:11px;box-shadow:0 12px 32px rgba(20,50,63,.16);
          padding:9px 12px;font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
          min-width:130px;max-width:330px;direction:rtl;text-align:right;font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;line-height:1.55;color:#1D2B32}
  .ch-tip.on{opacity:1;transform:none}
  .ch-tip-t{font-weight:700;color:#14323F;margin-bottom:3px}
  .ch-tip-r{display:flex;align-items:center;gap:8px}
  .ch-tip-r b{font-weight:800;color:#14323F;font-variant-numeric:tabular-nums}
  .ch-tip-r span{color:#647680}
  .ch-key{width:12px;height:3px;border-radius:2px;flex:none}
  .ch-tip-f{margin-top:5px;padding-top:5px;border-top:1px solid #EDF2F1;color:#647680}
  .ch-hbars{display:flex;flex-direction:column;gap:4px}
  .ch-hrow{display:grid;grid-template-columns:minmax(96px,36%) 1fr 46px;align-items:center;gap:12px;padding:5px 8px;border-radius:9px;outline:none;transition:background .15s}
  .ch-hrow.hl,.ch-hrow:focus-visible{background:#F1F6F5}
  .ch-hrow.click{cursor:pointer}
  .ch-hl{min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .ch-hl span{font-size:13px;font-weight:600;color:#1D2B32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-hl small{font-size:11px;color:#647680}
  .ch-htrack{position:relative;height:12px;background:#EDF2F1;border-radius:2px}
  .ch-htrack i{display:block;height:100%;border-radius:0;border-start-end-radius:4px;border-end-end-radius:4px}
  .ch-hth{position:absolute;top:-4px;bottom:-4px;width:0;border-inline-start:2px dashed #9C3029;margin-inline-start:-1px}
  .ch-hv{font-weight:800;color:#14323F;font-size:13px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-empty{padding:22px;text-align:center;color:#647680;font-size:13px}
  .ch-seg{display:flex;gap:2px;border-radius:99px;overflow:hidden;background:#EDF2F1;transition:clip-path .8s cubic-bezier(.22,.8,.26,1);clip-path:inset(0 0 0 0)}
  .ch-seg.grow{clip-path:inset(0 0 0 100%)}
  .ch-seg i{display:block;min-width:3px;outline:none;transition:filter .15s}
  .ch-seg i.rest{background:#EDF2F1;min-width:0}
  .ch-seg i.hl{filter:brightness(1.12) saturate(1.1)}
  .ch-strip{display:flex;flex-wrap:wrap;gap:3px}
  .ch-strip i{width:13px;height:13px;border-radius:3px;outline:none;transition:transform .15s,opacity .3s}
  .ch-strip i.none{background:#E4EAE9}
  .ch-strip i.hl{transform:scale(1.25)}
  .ch-strip.small{gap:2px;flex-wrap:nowrap}
  .ch-strip.small i{width:8px;height:14px;border-radius:2px}
  .ch-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#647680;margin-top:10px}
  .ch-leg span{display:inline-flex;align-items:center;gap:6px}
  .ch-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .ch-leg i.ln{width:14px;height:3px;border-radius:2px}
  .ch-leg i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed #9C3029}
  .ch-leg em{font-style:normal}
  .ch-spark{display:inline-block;vertical-align:middle}
  .ch-tbl{display:none;width:100%;border-collapse:collapse;font-size:13px}
  .ch-tbl th,.ch-tbl td{padding:6px 10px;border-bottom:1px solid #DCE5E3;text-align:right}
  .ch-tbl th{background:#E6F1EF;color:#14323F;font-weight:700;font-size:12px;position:static}
  .tbl-on .ch-plot,.tbl-on .ch-leg{display:none}
  .tbl-on .ch-tbl{display:table}
  .chd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .chd>div{flex:1;min-width:0}
  .chd h3{margin:0!important}
  .chd .muted{margin-top:1px}
  .tg{border:1px solid #DCE5E3;background:#fff;color:#647680;border-radius:8px;padding:2px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .tg:hover{border-color:#1F6F78;color:#14323F}
  @media print{.ch *{transition:none!important}.ch-tip{display:none!important}.tg{display:none}}
  @media (prefers-reduced-motion:reduce){.ch *{transition:none!important}}
  /*@CH-CSS-END*/
</style>
</head>
<body>
<div class="top"><div class="c" id="center">بطاقة الحضور</div><div class="n" id="name">…</div><div class="k" id="course"></div></div>
<div class="wrap">
  <div id="msg"></div>
  <div class="card">
    <img class="qr" id="qr" alt="QR">
    <div class="code" id="code"></div>
    <div class="tip">ارفع سطوع الشاشة وأبرز الرمز عند الدخول</div>
  </div>
  <div class="card" id="next" style="display:none"></div>
  <div class="card">
    <h3>حضوري</h3>
    <div class="row"><div id="ring"></div>
      <div class="stats"><div><i style="background:#2E9E6E"></i>حضور<b id="sP">0</b></div><div><i style="background:#D99A2B"></i>تأخير<b id="sL">0</b></div>
        <div><i style="background:#CF5148"></i>غياب<b id="sA">0</b></div><div><i style="background:#4C7FC4"></i>بعذر<b id="sE">0</b></div></div></div>
    <div class="muted" id="thr" style="margin-top:10px"></div>
    <div id="stripBox" style="display:none"><h4>جلساتي <span class="muted">(الأقدم على اليمين)</span></h4><div id="strip"></div></div>
  </div>
  <div class="card"><h3>السجل</h3><div class="hist" id="hist"><div class="muted">لا توجد جلسات بعد</div></div></div>
  <div class="center"><span class="muted" id="upd"></span> <button onclick="load()">تحديث</button></div>
</div>
<script>/*@CH-JS*/
/* ===================== CH — مخططات SVG خفيفة دون أي مكتبة خارجية =====================
 * نفس الشيفرة داخل لوحة التحكم وصفحة المدرب وبطاقة الطالب.
 * الزمن يسير من اليمين (الأقدم) إلى اليسار (الأحدث)، مثل أعمدة أوراق الدورات.
 * كل مخطط: حركة دخول ناعمة (تُلغى إذا طلب الجهاز تقليل الحركة)، تلميح عند المرور أو اللمس
 * أو التنقل بلوحة المفاتيح، وجدول بديل بنفس الأرقام (زر "جدول").
 */
var CH = (function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var C = {
    present: '#2E9E6E', late: '#D99A2B', excused: '#4C7FC4', absent: '#CF5148',
    waiting: '#A3B4B8', upcoming: '#E1E8E6', none: '#E4EAE9',
    sea: '#1F6F78', ink: '#14323F', text: '#1D2B32', mute: '#647680',
    grid: '#E9EFEE', axis: '#C8D5D2', track: '#EDF2F1', th: '#9C3029', surface: '#FFFFFF'
  };
  var STATUS = [
    { key: 'present', name: 'حاضر', color: C.present },
    { key: 'late', name: 'متأخر', color: C.late },
    { key: 'excused', name: 'عذر', color: C.excused },
    { key: 'absent', name: 'غائب', color: C.absent }
  ];
  var CODE = { P: 0, L: 1, E: 2, A: 3 };

  // ------------------------------------------------------------------ أدوات
  function S(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function H(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  /**
   * SVG text. anchor uses left/right meaning ('start' = text begins at x and extends right).
   * Arabic text gets an RTL base so "الحد 75%" reads correctly; numbers like "-20" stay LTR.
   */
  var AR = /[\u0600-\u06FF]/;
  function T(parent, x, y, text, cls, anchor) {
    var rtl = AR.test(text), a = anchor || 'middle';
    if (rtl && a != 'middle') a = a == 'start' ? 'end' : 'start';
    var t = S('text', { x: x, y: y, 'class': cls || '', 'text-anchor': a, direction: rtl ? 'rtl' : 'ltr' }, parent);
    t.textContent = text;
    return t;
  }
  /** عدد + معدود بقواعد العربية: 1 جلسة، جلستان، 3 جلسات، 11 جلسة */
  var WORDS = {
    session: ['جلسة', 'جلستان', 'جلسات', 'جلسة'], student: ['طالب', 'طالبان', 'طلاب', 'طالبًا'],
    point: ['نقطة', 'نقطتان', 'نقاط', 'نقطة'], day: ['يوم', 'يومان', 'أيام', 'يومًا'], minute: ['دقيقة', 'دقيقتان', 'دقائق', 'دقيقة']
  };
  function count(n, w) {
    var f = WORDS[w] || w;
    n = Math.round(n);
    return n == 2 ? f[1] : n + ' ' + (n >= 3 && n <= 10 ? f[2] : n > 10 ? f[3] : f[0]);
  }
  function fmtN(n) { return n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  /** Integer percentages that always add up to 100 (largest remainder). */
  function shares(values) {
    var tot = values.reduce(function (a, v) { return a + (v || 0); }, 0);
    if (!tot) return values.map(function () { return 0; });
    var raw = values.map(function (v) { return (v || 0) * 100 / tot; }), out = raw.map(Math.floor);
    var left = 100 - out.reduce(function (a, v) { return a + v; }, 0);
    raw.map(function (v, i) { return { i: i, f: v - Math.floor(v) }; }).sort(function (a, b) { return b.f - a.f; })
      .slice(0, left).forEach(function (x) { out[x.i]++; });
    return out;
  }
  function niceScale(rawMax, k) {
    rawMax = Math.max(rawMax, 1);
    var rough = rawMax / (k || 4), p = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10)), m = rough / p;
    var step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    if (step < 1) step = 1;
    var max = Math.ceil(rawMax / step) * step, ticks = [];
    for (var t = 0; t <= max + 1e-9; t += step) ticks.push(t);
    return { max: max, ticks: ticks };
  }
  function later(fn) {
    var done = false;
    function go() { if (!done) { done = true; fn(); } }
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 700);                                  // تبويب في الخلفية: لا تبقى المخططات فارغة
  }
  function roundTop(x, y, w, h, r) {                       // عمود بزاويتين مدوّرتين في الأعلى فقط
    r = Math.max(0, Math.min(r, w / 2, h));
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
           'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  // ------------------------------------------------------------------ التلميح
  var tip = null, tipOff = null;
  function tipShow(pos, d, off) {
    if (tipOff && tipOff !== off) tipOff();
    tipOff = off || null;
    if (!tip) tip = H('div', 'ch-tip', document.body);
    tip.textContent = '';
    if (d.title) H('div', 'ch-tip-t', tip, d.title);
    (d.rows || []).forEach(function (r) {
      var row = H('div', 'ch-tip-r', tip);
      var k = H('i', 'ch-key', row);
      k.style.background = r.color || 'transparent';
      H('b', '', row, r.value);
      H('span', '', row, r.label);
    });
    if (d.foot) H('div', 'ch-tip-f', tip, d.foot);
    tip.classList.add('on');
    var x = pos.clientX != null ? pos.clientX : pos.left + pos.width / 2;
    var y = pos.clientY != null ? pos.clientY : pos.top;
    var w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var left = x - w - 14;
    if (left < 8) left = x + 14;
    if (left + w > vw - 8) left = Math.max(8, vw - w - 8);
    var top = y - h - 12;
    if (top < 8) top = y + 18;
    if (top + h > vh - 8) top = Math.max(8, vh - h - 8);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function tipHide() {
    if (tip) tip.classList.remove('on');
    if (tipOff) { var f = tipOff; tipOff = null; f(); }
  }
  document.addEventListener('pointerdown', function (e) {
    if (!(e.target && e.target.closest && e.target.closest('.ch [tabindex], .ch-hrow, .ch-seg i, .ch-strip i'))) tipHide();
  }, true);
  window.addEventListener('scroll', tipHide, true);
  window.addEventListener('blur', tipHide);

  /** Hover + touch + keyboard on one mark. get() -> {title, rows, foot}; hl(on) lifts the mark. */
  function bind(el, get, hl) {
    function off() { if (hl) hl(false); }
    function show(e) { var d = get(e); if (!d) return; if (hl) hl(true); tipShow(e && e.clientX != null ? e : el.getBoundingClientRect(), d, off); }
    el.addEventListener('pointermove', show);
    el.addEventListener('pointerdown', show);
    el.addEventListener('pointerleave', function (e) { if (e.pointerType != 'touch') tipHide(); });
    el.setAttribute('tabindex', '0');
    el.addEventListener('focus', function () { show(null); });
    el.addEventListener('blur', tipHide);
  }

  // ------------------------------------------------------------------ التركيب والاستجابة للعرض
  // mode 'w': depends on width (redrawn when the width changes; waits while hidden)
  // mode 'v': waits while hidden so its entrance animation is seen; otherwise drawn once
  var RO = window.ResizeObserver ? new ResizeObserver(function (list) {
    list.forEach(function (en) {
      var h = en.target, m = h._ch;
      if (!h.isConnected) { RO.unobserve(h); return; }
      if (!m || h.clientWidth < 40) return;
      if (h._chPending || (m.mode == 'w' && Math.abs((h._chW || 0) - h.clientWidth) > 12)) mount(h, m.fn, m.opt, m.mode);
    });
  }) : null;
  function mount(host, fn, opt, mode) {
    host._ch = { fn: fn, opt: opt, mode: mode };
    if (mode && RO && !host._chObs) { RO.observe(host); host._chObs = true; }
    var w = host.clientWidth;
    if (RO && ((mode == 'w' && w < 40) || (mode == 'v' && !host.getClientRects().length))) { host._chPending = true; return; }
    host._chPending = false;
    var anim = !RM && !host._chDone && opt.animate !== false;
    host._chW = w;
    host._chDone = true;
    host.textContent = '';
    host.classList.add('ch');
    fn(host, opt, w, anim);
  }
  function legend(host, entries) {
    var lg = H('div', 'ch-leg', host);
    entries.forEach(function (e) {
      var s = H('span', '', lg), i = H('i', e.kind || '', s);
      if (e.kind != 'dash') i.style.background = e.color;
      H('em', '', s, e.name);
    });
    return lg;
  }
  function table(host, head, rows) {
    var t = H('table', 'ch-tbl', host), tr = H('tr', '', t);
    head.forEach(function (h) { H('th', '', tr, h); });
    rows.forEach(function (r) { var row = H('tr', '', t); r.forEach(function (c) { H('td', '', row, c == null ? '—' : c); }); });
    return t;

    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  return {
    C: C, STATUS: STATUS, shares: shares, fmt: fmtN, count: count, toggle: toggle, hide: tipHide,
    donut: function (h, o) { mount(h, donut, o, 'v'); },
    columns: function (h, o) { mount(h, columns, o, 'w'); },
    line: function (h, o) { mount(h, line, o, 'w'); },
    hbars: function (h, o) { mount(h, hbars, o, 'v'); },
    segbar: function (h, o) { mount(h, segbar, o); },
    strip: function (h, o) { mount(h, strip, o); },
    spark: spark,
    /** نص أعمدة توقيت الوصول، من حدود الفئات القادمة من الخادم */
    arrivalLabel: function (b) { return b.lo == null ? 'أبكر' : b.lo > 0 ? '+' + b.lo : String(b.lo); },
    arrivalTitle: function (b) {
      if (b.lo == null) return 'أكثر من ' + (-b.hi) + ' دقيقة قبل البداية';
      if (b.hi == null) return b.lo + ' دقيقة أو أكثر بعد البداية';
      function u(n) { return n >= 3 && n <= 10 ? ' دقائق' : ' دقيقة'; }   // الرقم مذكور قبلها دائمًا
      if (b.hi <= 0) return b.hi == 0 ? 'في آخر ' + (-b.lo) + u(-b.lo) + ' قبل البداية' : 'قبل البداية بـ ' + (-b.hi) + ' إلى ' + (-b.lo) + u(-b.lo);
      return b.lo == 0 ? 'في أول ' + b.hi + u(b.hi) + ' بعد البداية' : 'بعد البداية بـ ' + b.lo + ' إلى ' + b.hi + u(b.hi);
    }
  };
})();

/* ---------- مخططات التقارير الجاهزة (مشتركة بين لوحة التحكم وصفحة المدرب) ---------- */
CH.v = (function () {
  var C = CH.C, ST = CH.STATUS;
  function dm(key) { var p = String(key).split('-'); return p.length == 3 ? (+p[2]) + '/' + (+p[1]) : key; }
  function slotTitle(s) { return s.day + ' ' + s.date + ' — ' + (s.n == 'X' ? 'خارج الجدول' : 'الجلسة ' + s.n + ' (' + s.label + ')'); }
  function rate(x) { var d = x.present + x.late + x.absent; return d ? Math.round((x.present + x.late) * 100 / d) : null; }
  function statusItems(x, absentLabel) {
    return ST.map(function (s) { return { label: s.key == 'absent' && absentLabel ? absentLabel : s.name, value: x[s.key] || 0, color: s.color }; });
  }
  return {
    dm: dm, rate: rate, slotTitle: slotTitle,
    /** حلقة توزيع الحالات؛ المركز = نسبة الحضور */
    donut: function (host, x, o) {
      o = o || {};
      var r = rate(x);
      CH.donut(host, { items: statusItems(x), size: o.size || 176, legend: o.legend, animate: o.animate,
        centerValue: r == null ? '—' : r + '%', centerLabel: o.centerLabel || 'نسبة الحضور', emptyLabel: o.empty || 'لا توجد جلسات بعد' });
    },
    /** نسبة الحضور في كل جلسة منتهية */
    sessionRate: function (host, r, o) {
      var sl = r.slots.filter(function (s) { return s.ended; });
      if (!sl.length) { host.innerHTML = '<div class="ch-empty">تظهر النسب بعد انتهاء أول جلسة</div>'; return; }
      CH.line(host, { labels: sl.map(function (s) { return dm(s.date); }), titles: sl.map(slotTitle), values: sl.map(rate),
        yMax: 100, unit: '%', threshold: r.threshold, name: 'نسبة الحضور', height: (o && o.height) || 210, animate: o && o.animate,
        tipRows: function (i) { var s = sl[i]; return ST.map(function (t) { return { color: t.color, value: CH.fmt(s[t.key]), label: t.name }; }); },
        tableHead: ['الجلسة', 'نسبة الحضور'] });
    },
    /** عدد الطلاب في كل جلسة، مكدّس حسب الحالة */
    sessionCols: function (host, r, o) {
      if (!r.slots.length) { host.innerHTML = '<div class="ch-empty">لا جلسات بعد</div>'; return; }
      var multi = r.course && r.course.sessions && r.course.sessions.length > 1;
      CH.columns(host, { labels: r.slots.map(function (s) { return dm(s.date); }), titles: r.slots.map(slotTitle),
        sub: multi ? r.slots.map(function (s) { return s.n == 'X' ? '—' : 'ج' + s.n; }) : null,
        data: r.slots, series: ST, height: (o && o.height) || 230, animate: o && o.animate, minBand: 12,
        foot: function (i) { var s = r.slots[i], p = rate(s); return (s.ended ? '' : 'جلسة جارية — ') + (p == null ? '' : 'نسبة الحضور ' + p + '%'); },
        tableHead: ['الجلسة'].concat(ST.map(function (s) { return s.name; })) });
    },
    /** توزيع الطلاب على شرائح النسبة: تحت الحد / حوله / فوقه */
    distribution: function (host, r, o) {
      var bins = [];
      for (var b = 0; b < 10; b++) bins.push({ lo: b * 10, hi: b == 9 ? 100 : b * 10 + 9, n: 0, names: [] });
      r.rows.forEach(function (x) {
        if (x.pct == null || x.status != 'مقبول') return;
        var k = Math.min(9, Math.floor(x.pct / 10));
        bins[k].n++; bins[k].names.push(x.name);
      });
      var th = r.threshold;
      function cls(bn) { return bn.hi < th ? 'absent' : bn.lo < th ? 'late' : 'present'; }
      var names = { absent: 'تحت الحد', late: 'حول الحد', present: 'فوق الحد' };
      host.textContent = '';
      var plot = document.createElement('div');
      host.appendChild(plot);
      CH.columns(plot, { labels: bins.map(function (bn) { return bn.lo + '%'; }), titles: bins.map(function (bn) { return 'من ' + bn.lo + '% إلى ' + bn.hi + '%'; }),
        data: bins.map(function (bn) { return { v: bn.n }; }), series: [{ key: 'v', name: 'عدد الطلاب', color: C.present }],
        colorOf: function (i) { return C[cls(bins[i])]; }, capLabels: true, height: (o && o.height) || 210, animate: o && o.animate, labelW: 30,
        xTitle: 'نسبة حضور الطالب', legend: false,
        foot: function (i) { var bn = bins[i]; return names[cls(bn)] + (bn.names.length ? ' — ' + bn.names.slice(0, 6).join('، ') + (bn.names.length > 6 ? '…' : '') : ''); },
        tableHead: ['الشريحة', 'عدد الطلاب'] });
      var lg = document.createElement('div');
      lg.className = 'ch-leg';
      ['absent', 'late', 'present'].forEach(function (k) {
        var s = document.createElement('span'), i = document.createElement('i'), e = document.createElement('em');
        i.style.background = C[k]; e.textContent = names[k] + (k == 'late' ? ' (' + th + '%)' : '');
        s.appendChild(i); s.appendChild(e); lg.appendChild(s);
      });
      host.appendChild(lg);
    },
    /** متى يصل الطلاب؟ فئات 5 دقائق حول بداية الجلسة */
    arrivals: function (host, bins, o) {
      var tot = bins.reduce(function (a, b) { return a + b.ok + b.late; }, 0);
      if (!tot) { host.innerHTML = '<div class="ch-empty">يظهر بعد أول عمليات مسح</div>'; return; }
      CH.columns(host, { labels: bins.map(CH.arrivalLabel), titles: bins.map(CH.arrivalTitle), data: bins,
        series: [{ key: 'ok', name: 'في الموعد', color: C.present }, { key: 'late', name: 'متأخر', color: C.late }],
        height: (o && o.height) || 210, animate: o && o.animate, labelW: 22, xTitle: 'الدقائق بالنسبة لبداية الجلسة (0 = البداية)',
        foot: function (i) { var b = bins[i], n = b.ok + b.late; return n ? Math.round(n * 100 / tot) + '% من كل عمليات الوصول' : ''; },
        tableHead: ['التوقيت', 'في الموعد', 'متأخر'] });
    },
    /** شريط كل جلسات طالب واحد + تطور نسبته */
    studentStrip: function (host, x, r, o) {
      CH.strip(host, { seq: x.seq || '', titles: r.slots.map(slotTitle), last: o && o.last, small: o && o.small, blankLegend: 'لا تُحتسب (جارية أو قبل تسجيله)', animate: o && o.animate });
    },
    studentTrend: function (host, x, r) {
      var p = 0, l = 0, a = 0, labels = [], titles = [], vals = [];
      (x.seq || '').split('').forEach(function (c, i) {
        if (c == '-') return;
        if (c == 'P') p++; else if (c == 'L') l++; else if (c == 'A') a++;
        labels.push(dm(r.slots[i].date)); titles.push(slotTitle(r.slots[i]));
        vals.push(p + l + a ? Math.round((p + l) * 100 / (p + l + a)) : null);
      });
      if (!vals.length) { host.innerHTML = '<div class="ch-empty">لا جلسات محتسبة بعد</div>'; return; }
      CH.line(host, { labels: labels, titles: titles, values: vals, yMax: 100, unit: '%', threshold: r.threshold, name: 'النسبة التراكمية', height: 170 });
    }
  };
})();
/*@CH-JS-END*/</script>
<script>
var P = {};
(location.hash || '').slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) P[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('card_' + k)); localStorage.setItem('card_' + k, JSON.stringify(v)); } catch (e) { return null; } }
if (P.t && P.api) ls('cfg', { t: P.t, api: P.api });
var CFG = ls('cfg') || {};
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function chip(r) {
  var cls = r == 'حاضر' || r == 'حضور يدوي' ? 'c-ok' : r == 'متأخر' ? 'c-late' : r == 'عذر' ? 'c-exc' : 'c-bad';
  return '<span class="chip ' + cls + '">' + esc(r) + '</span>';
}
function render(d, cached) {
  $('center').textContent = d.center; $('name').textContent = d.name; $('course').textContent = d.course;
  document.title = 'بطاقة ' + d.name;
  $('qr').src = d.qr; $('code').textContent = d.code;
  var warn = [];
  if (d.status != 'مقبول') warn.push('حالتك في الدورة: ' + d.status + '. تواصل مع المركز.');
  if (d.courseStatus != 'نشطة') warn.push('الدورة ' + d.courseStatus + '.');
  if (cached) warn.push('أنت دون إنترنت: هذه آخر نسخة محفوظة (' + d.updated + '). الرمز يعمل كالمعتاد.');
  $('msg').innerHTML = warn.map(function (w) { return '<div class="warn">' + esc(w) + '</div>'; }).join('');
  $('next').style.display = d.next ? '' : 'none';
  $('next').innerHTML = '<h3>الجلسة القادمة</h3><div>' + esc(d.next.replace('الجلسة القادمة: ', '')) + '</div><div class="muted" style="margin-top:6px">' + esc(d.schedule) + '</div>';
  var s = d.stats, p = s.pct;
  CH.donut($('ring'), { size: 116, legend: false, items: CH.STATUS.map(function (x) { return { label: x.name, value: s[x.key], color: x.color }; }),
    centerValue: p == null ? '—' : p + '%', centerLabel: 'نسبتي', emptyLabel: 'لا جلسات بعد', unit: ' جلسة' });
  var hist = d.history.slice().reverse(), code = { 'حاضر': 'P', 'حضور يدوي': 'P', 'متأخر': 'L', 'عذر': 'E', 'غائب': 'A' };
  $('stripBox').style.display = hist.length ? '' : 'none';
  if (hist.length) CH.strip($('strip'), { seq: hist.map(function (h) { return code[h.result] || '-'; }).join(''), legend: true,
    titles: hist.map(function (h) { return h.day + ' ' + h.date + ' — ' + (h.n == 'X' ? 'خارج الجدول' : 'الجلسة ' + h.n) + (h.time ? ' — ' + h.time : ''); }) });
  $('sP').textContent = s.present; $('sL').textContent = s.late; $('sA').textContent = s.absent; $('sE').textContent = s.excused;
  $('thr').textContent = 'النسبة المطلوبة: ' + d.threshold + '%' + (p != null && p < d.threshold ? ' — نسبتك أقل من المطلوب' : '');
  $('hist').innerHTML = d.history.length ? d.history.map(function (h) {
    return '<div><span>' + esc(h.day) + ' ' + esc(h.date) + ' <span class="muted">ج' + esc(h.n) + '</span></span><span>' + (h.time ? '<span class="muted">' + esc(h.time) + '</span> ' : '') + chip(h.result) + '</span></div>';
  }).join('') : '<div class="muted">لا توجد جلسات بعد</div>';
  $('upd').textContent = 'آخر تحديث: ' + d.updated;
}
function load() {
  if (!CFG.t || !CFG.api) { $('msg').innerHTML = '<div class="warn err">الرابط غير مكتمل. افتح الرابط المرسل إليك من المركز.</div>'; return; }
  fetch(CFG.api + '?action=card&t=' + encodeURIComponent(CFG.t)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) {
      ls('data', null);
      $('qr').removeAttribute('src'); $('code').textContent = '';
      $('msg').innerHTML = '<div class="warn err">هذا الرمز لم يعد صالحًا (ربما أُصدر لك رمز جديد). تواصل مع المركز أو افتح أحدث رسالة وصلتك.</div>';
      return;
    }
    ls('data', d); render(d, false);
  }).catch(function () {
    var d = ls('data');
    if (d) render(d, true); else $('msg').innerHTML = '<div class="warn err">لا يوجد اتصال بالإنترنت. افتح الصفحة مرة واحدة مع الإنترنت لتُحفظ على هاتفك.</div>';
  });
}
var cached = ls('data');
if (cached && cached.code && CFG.t && cached.code.replace(/-/g, '') == CFG.t.replace(/-/g, '')) render(cached, false);
load();
</script>
