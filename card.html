<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#301B43">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بطاقة الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#211A29;--mute:#71677C;--line:#E5E0EC;--pri:#301B43;--sea:#603F80;--mint:#F1EBF9;--ok:#2E9E6E;--late:#D99A2B;--bad:#CF5148;--exc:#4C7FC4}
  *{box-sizing:border-box}
  body{margin:0;background:#F8F6FB;color:var(--ink);font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;line-height:1.6;font-feature-settings:"tnum" 1}
  .top{background:linear-gradient(120deg,#301B43 0%,#4B2F66 100%);color:#fff;padding:18px 18px 70px;text-align:center}
  .card.idc{border-top:5px solid var(--sea);padding-top:16px}
  .idlogo{display:block;height:104px;width:auto;margin:0 auto 12px;color:var(--sea)}
  .idc .qr{border:1px solid var(--line);border-radius:14px;padding:8px}
  .top .c{font-size:13px;color:#D2C4E2;font-weight:600}.top .n{font-size:26px;font-weight:800;margin-top:4px}.top .k{font-size:15px;margin-top:2px;color:#E1D4F0}
  .wrap{max-width:460px;margin:-52px auto 0;padding:0 14px 30px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
  .qr{display:block;width:100%;max-width:300px;margin:0 auto;image-rendering:pixelated;background:#fff}
  .code{text-align:center;font-weight:700;font-size:20px;letter-spacing:2px;margin-top:10px;direction:ltr;color:var(--pri)}
  .tip{text-align:center;color:var(--mute);font-size:13px;margin-top:6px}
  .row{display:flex;gap:12px;align-items:center}
  #ring{flex:none}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1}
  .stats div{background:var(--mint);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute);font-weight:600}
  .stats i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px}
  .stats b{display:block;font-size:20px;font-weight:800;color:var(--pri)}
  h4{margin:16px 0 8px;font-size:14px;color:var(--pri);font-weight:700}
  h3{margin:0 0 10px;font-size:16px;font-weight:700;color:var(--pri)}
  .hist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .hist div:last-child{border:0}
  .chip{padding:1px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-ok{background:#E3F3EB;color:#1F6E4C}.c-late{background:#FBF0DA;color:#8A5E12}.c-bad{background:#FAE7E5;color:#9C3029}.c-exc{background:#E7EEF8;color:#2F5A93}
  .muted{color:var(--mute);font-size:12px}
  .warn{background:#FBF0DA;color:#8A5E12;border:1px solid #F1DDAF;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
  .err{background:#FAE7E5;color:#9C3029;border-color:#F2CCC8}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--mint);color:var(--pri);cursor:pointer}
  .center{text-align:center}
  .wait{background:var(--mint);color:var(--pri);border:1px solid #DCCFEA;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;text-align:center}
  .wait b{display:block;font-size:30px;font-weight:800;line-height:1.2}
  .qr.dim{opacity:.18;filter:grayscale(1)}
  .tgbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#2AA3DE;color:#fff;font-size:15px;padding:12px 16px;text-decoration:none;border-radius:14px;font-weight:700}
  .tgbtn svg{width:22px;height:22px;flex:none}
  .tgok{display:flex;align-items:center;gap:10px;font-size:14px}
  .tgok a{margin-inline-start:auto;color:#1D7FB2;font-weight:700;text-decoration:none}
  .tgdot{width:30px;height:30px;border-radius:50%;background:#2AA3DE;display:flex;align-items:center;justify-content:center;flex:none}
  .tgdot svg{width:17px;height:17px}
  label.f{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:10px 0 5px}
  select,textarea{width:100%;font:inherit;font-size:15px;border:1px solid #D0C8DA;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:86px;resize:vertical;line-height:1.7}
  select:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px rgba(96,63,128,.14)}
  button.p{background:var(--sea);color:#fff;width:100%;margin-top:12px;padding:12px}
  button.p:disabled{opacity:.55}
  button.ghost{background:transparent;color:var(--sea);padding:6px 0}
  .req div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .req div:last-child{border:0}
  .req .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .req .rp{color:var(--mute);font-size:12.5px;margin-top:2px}
  .c-wait{background:#FBF0DA;color:#8A5E12}
  .note{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:600}
  .note.ok{background:#E3F3EB;color:#1F6E4C}.note.no{background:#FAE7E5;color:#9C3029}
/*@CH-CSS*/
  /* ---------- المخططات (CH) ---------- */
  .ch{position:relative}
  .ch svg{display:block;overflow:visible;max-width:none;direction:ltr}
  .ch svg text{font-family:inherit;fill:#71677C;font-size:11px}
  .ch .ch-tick{font-variant-numeric:tabular-nums}
  .ch .ch-sub{font-size:10.5px;fill:#857C90}
  .ch .ch-axt{font-size:11px;fill:#857C90}
  .ch .ch-thl{fill:#9C3029;font-size:11px;font-weight:700}
  .ch .ch-cap{fill:#301B43;font-size:11.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch .ch-end{fill:#301B43;font-size:12.5px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .ch-cols.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .ch-col{transition:opacity .18s}
  .ch svg.dim .ch-col:not(.hl){opacity:.35}
  .ch-hit{cursor:pointer;outline:none}
  .ch-hit:focus-visible{outline:none;stroke:#603F80;stroke-width:1.5;stroke-dasharray:3 3}
  .ch-cross{display:none;pointer-events:none}
  .ch svg.xon .ch-cross{display:block}
  .ch-arc{transition:stroke-width .18s,opacity .18s;cursor:pointer;outline:none}
  .ch svg.dim .ch-arc:not(.hl){opacity:.32}
  .ch-donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .ch-donut.solo{justify-content:center}
  .ch-dfig{position:relative;flex:none}
  .ch-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18%}
  .ch-dc b{font-weight:800;color:#301B43;line-height:1.1}
  .ch-dc span{font-size:11.5px;color:#71677C;font-weight:600;line-height:1.35;margin-top:2px}
  .ch-legend{display:flex;flex-direction:column;gap:2px;flex:1;min-width:170px;max-width:300px}
  .ch-li{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 8px;border-radius:9px;transition:background .15s}
  .ch-li.hl,.ch-li:hover{background:#F5F2F9}
  .ch-li i{width:10px;height:10px;border-radius:3px;flex:none}
  .ch-li span{flex:1;color:#211A29}
  .ch-li b{font-weight:700;color:#301B43;font-variant-numeric:tabular-nums}
  .ch-li em{font-style:normal;color:#71677C;font-size:12px;min-width:36px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-li.zero{opacity:.45}
  .ch-tip{position:fixed;z-index:200;background:#fff;border:1px solid #E5E0EC;border-radius:11px;box-shadow:0 12px 32px rgba(48,27,67,.16);
          padding:9px 12px;font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
          min-width:130px;max-width:330px;direction:rtl;text-align:right;font-family:"Cairo","Dubai","Segoe UI",Tahoma,sans-serif;line-height:1.55;color:#211A29}
  .ch-tip.on{opacity:1;transform:none}
  .ch-tip-t{font-weight:700;color:#301B43;margin-bottom:3px}
  .ch-tip-r{display:flex;align-items:center;gap:8px}
  .ch-tip-r b{font-weight:800;color:#301B43;font-variant-numeric:tabular-nums}
  .ch-tip-r span{color:#71677C}
  .ch-key{width:12px;height:3px;border-radius:2px;flex:none}
  .ch-tip-f{margin-top:5px;padding-top:5px;border-top:1px solid #EDE9F2;color:#71677C}
  .ch-hbars{display:flex;flex-direction:column;gap:4px}
  .ch-hrow{display:grid;grid-template-columns:minmax(96px,36%) 1fr 46px;align-items:center;gap:12px;padding:5px 8px;border-radius:9px;outline:none;transition:background .15s}
  .ch-hrow.hl,.ch-hrow:focus-visible{background:#F5F2F9}
  .ch-hrow.click{cursor:pointer}
  .ch-hl{min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .ch-hl span{font-size:13px;font-weight:600;color:#211A29;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-hl small{font-size:11px;color:#71677C}
  .ch-htrack{position:relative;height:12px;background:#EDE9F2;border-radius:2px}
  .ch-htrack i{display:block;height:100%;border-radius:0;border-start-end-radius:4px;border-end-end-radius:4px}
  .ch-hth{position:absolute;top:-4px;bottom:-4px;width:0;border-inline-start:2px dashed #9C3029;margin-inline-start:-1px}
  .ch-hv{font-weight:800;color:#301B43;font-size:13px;text-align:left;font-variant-numeric:tabular-nums}
  .ch-empty{padding:22px;text-align:center;color:#71677C;font-size:13px}
  .ch-seg{display:flex;gap:2px;border-radius:99px;overflow:hidden;background:#EDE9F2;transition:clip-path .8s cubic-bezier(.22,.8,.26,1);clip-path:inset(0 0 0 0)}
  .ch-seg.grow{clip-path:inset(0 0 0 100%)}
  .ch-seg i{display:block;min-width:3px;outline:none;transition:filter .15s}
  .ch-seg i.rest{background:#EDE9F2;min-width:0}
  .ch-seg i.hl{filter:brightness(1.12) saturate(1.1)}
  .ch-strip{display:flex;flex-wrap:wrap;gap:3px}
  .ch-strip i{width:13px;height:13px;border-radius:3px;outline:none;transition:transform .15s,opacity .3s}
  .ch-strip i.none{background:#E6E3EB}
  .ch-strip i.hl{transform:scale(1.25)}
  .ch-strip.small{gap:2px;flex-wrap:nowrap}
  .ch-strip.small i{width:8px;height:14px;border-radius:2px}
  .ch-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#71677C;margin-top:10px}
  .ch-leg span{display:inline-flex;align-items:center;gap:6px}
  .ch-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .ch-leg i.ln{width:14px;height:3px;border-radius:2px}
  .ch-leg i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed #9C3029}
  .ch-leg em{font-style:normal}
  .ch-spark{display:inline-block;vertical-align:middle}
  .ch-tbl{display:none;width:100%;border-collapse:collapse;font-size:13px}
  .ch-tbl th,.ch-tbl td{padding:6px 10px;border-bottom:1px solid #E5E0EC;text-align:right}
  .ch-tbl th{background:#F1EBF9;color:#301B43;font-weight:700;font-size:12px;position:static}
  .tbl-on .ch-plot,.tbl-on .ch-leg{display:none}
  .tbl-on .ch-tbl{display:table}
  .chd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .chd>div{flex:1;min-width:0}
  .chd h3{margin:0!important}
  .chd .muted{margin-top:1px}
  .tg{border:1px solid #E5E0EC;background:#fff;color:#71677C;border-radius:8px;padding:2px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .tg:hover{border-color:#603F80;color:#301B43}
  @media print{.ch *{transition:none!important}.ch-tip{display:none!important}.tg{display:none}}
  @media (prefers-reduced-motion:reduce){.ch *{transition:none!important}}
  /*@CH-CSS-END*/
</style>
</head>

}
function load(after) {
  if (!CFG.t || !CFG.api) { $('msg').innerHTML = '<div class="warn err">الرابط غير مكتمل. افتح الرابط المرسل إليك من المركز.</div>'; return; }
  fetch(CFG.api + '?action=card&t=' + encodeURIComponent(CFG.t)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) {
      ls('data', null);
      $('qr').removeAttribute('src'); $('code').textContent = '';
      $('msg').innerHTML = '<div class="warn err">هذا الرمز لم يعد صالحًا (ربما أُصدر لك رمز جديد). تواصل مع المركز أو افتح أحدث رسالة وصلتك.</div>';
      return;
    }
    if ($('exSlot')) EXC_SEL = $('exSlot').value;
    var draft = $('exWhy') ? $('exWhy').value : '';
    ls('data', d); render(d, false);
    if (draft && $('exWhy') && !after) $('exWhy').value = draft;           // لا يضيع ما كتبه عند التحديث
    if (after) after();
  }).catch(function () {
    var d = ls('data');
    if (d) render(d, true); else $('msg').innerHTML = '<div class="warn err">لا يوجد اتصال بالإنترنت. افتح الصفحة مرة واحدة مع الإنترنت لتُحفظ على هاتفك.</div>';
  });
}
var cached = ls('data');
if (cached && cached.code && CFG.t && cached.code.replace(/-/g, '') == CFG.t.replace(/-/g, '')) render(cached, false);
load();
</script>
</body>
</html>
